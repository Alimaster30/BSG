services:
  - type: web
    name: smart-balance-sheet-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: 25
      - key: MAX_PARSE_ROWS
        value: 100000
      - key: JSON_BODY_LIMIT
        value: 75mb
